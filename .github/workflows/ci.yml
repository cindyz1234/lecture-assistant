name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Swift packages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build and test each package
        run: |
          for pkg in Packages/*/; do
            echo "::group::$pkg"
            if [ -d "$pkg/Tests" ]; then
              swift test --package-path "$pkg"
            else
              swift build --package-path "$pkg"
            fi
            echo "::endgroup::"
          done

  app:
    name: App (iOS + macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for macOS
        run: >
          xcodebuild build -project LectureAssistant.xcodeproj -scheme LectureAssistant
          -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO
      - name: Build for iOS
        run: >
          xcodebuild build -project LectureAssistant.xcodeproj -scheme LectureAssistant
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

  python:
    name: ML scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - run: pytest ml
